<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Goallitea</title>
    <meta
      name="description"
      content="Responsive brand designer landing page for goallitea.com."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="hero" aria-label="Hero">
        <div class="hero-art"></div>
      </section>

      <section class="info" aria-label="Profile">
        <div class="profile">
          <img
            class="avatar"
            src="./assets/alec-kendzerski.png"
            alt="Portrait of Alec Kendzerski"
            width="70"
            height="70"
          />
          <div class="identity">
            <h1>Alec Kendzerski</h1>
            <p>Icon &amp; Brand designer</p>
          </div>
        </div>

        <div class="brands">
          <p class="label">Brands I worked with</p>
          <div class="brand-list" aria-label="Client brands">
            <span>Deloitte</span>
            <span>JNJ</span>
            <span>EPA</span>
            <span>Aristocrat</span>
            <span>Frontegg</span>
            <span>Paradox</span>
          </div>
        </div>
      </section>

      <footer class="footer">
        <p>&copy; 2026</p>
        <div class="contacts" aria-label="Contacts">
          <a href="mailto:hi@goallitea.com">hi@goallitea.com</a>
          <span>Twitter</span>
          <span>Telegram</span>
        </div>
      </footer>
    </main>
  </body>
</html>
